name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore PrivateConversationCopilot.sln
      - run: dotnet build PrivateConversationCopilot.sln -c Release --no-restore
      - run: dotnet test tests/Copilot.Tests -c Release --no-build --logger trx
      - run: dotnet publish src/Copilot.App -c Release -r win-x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: PrivateConversationCopilot-win-x64
          path: publish/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
